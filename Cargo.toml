[package]
name = "fastcull"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "ARW Sprint: fast Sony RAW photo culling for Intel Macs"
license = "MIT"

[features]
default = []
turbo = ["dep:turbojpeg"]
zune = ["dep:zune-jpeg", "dep:zune-core"]
desktop = ["turbo", "dep:winit", "dep:wgpu", "dep:pollster", "dep:rfd", "dep:font8x8", "dep:quick-xml", "dep:muda", "dep:trash", "dep:cc"]

[dependencies]
turbojpeg = { version = "=1.5.1", optional = true, default-features = false, features = ["cmake", "require-simd"] }
zune-jpeg = { version = "=0.5.15", optional = true }
zune-core = { version = "=0.5.1", optional = true }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
wgpu = { version = "=24.0.5", optional = true, default-features = false, features = ["metal", "wgsl"] }
pollster = { version = "=0.4.0", optional = true }
rfd = { version = "=0.15.4", optional = true, default-features = false }
font8x8 = { version = "=0.3.1", optional = true }
quick-xml = { version = "=0.37.5", optional = true }
muda = { version = "=0.16.1", optional = true, default-features = false }
trash = { version = "=5.2.3", optional = true, default-features = false }

[build-dependencies]
cc = { version = "=1.4.7", optional = true }

[[bin]]
name = "fastcull"
path = "src/bin/fastcull.rs"
required-features = ["desktop"]

[[bin]]
name = "fastcull-upload-contention-bench"
path = "src/bin/fastcull-upload-contention-bench.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev.package.zune-jpeg]
opt-level = 3
